name: disk-cleanup
version: 2.0.0
description: "Acompanha e remove automaticamente ficheiros temporários (scripts de teste, saídas temporárias, logs de cron) criados durante sessões do Ector. Corre via hooks do plugin, sem ação explícita do agente."
author: "@LVT382009 (original), Ector (plugin port)"
hooks:
  - post_tool_call
  - on_session_end
